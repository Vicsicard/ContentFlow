{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h1>ContentFlow Upload</h1>
    <p>Upload a VTT file for processing</p>
    
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('upload') }}" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="client_id" class="form-label">Select Client</label>
            <select class="form-select" id="client_id" name="client_id" onchange="toggleNewClient()">
                <option value="">-- Select Client --</option>
                <option value="new">++ Create New Client ++</option>
                {% for client in clients %}
                <option value="{{ client.id }}">{{ client.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-3" id="newClientDiv" style="display: none;">
            <label for="newClientName" class="form-label">New Client Name</label>
            <input type="text" class="form-control" id="newClientName" name="newClientName" placeholder="Enter client name">
        </div>
        
        <div class="mb-3">
            <label for="vtt_file" class="form-label">VTT File (required):</label>
            <input class="form-control" type="file" id="vtt_file" name="vtt_file" accept=".vtt" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Upload and Process</button>
    </form>
    
    <div class="action-links">
        <a href="{{ url_for('jobs') }}" class="button">View Processing Jobs</a>
    </div>

<script>
function toggleNewClient() {
    var clientSelect = document.getElementById('client_id');
    var newClientDiv = document.getElementById('newClientDiv');
    
    if (clientSelect.value === 'new') {
        newClientDiv.style.display = 'block';
    } else {
        newClientDiv.style.display = 'none';
    }
}
</script>
{% endblock %}
