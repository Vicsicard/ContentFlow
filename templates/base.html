<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContentFlow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        header {
            background-color: #f4f4f4;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        h1, h2, h3 {
            color: #444;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="file"], input[type="submit"] {
            padding: 8px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            width: auto;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .status {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 3px;
        }
        .status-processing {
            background-color: #fffde7;
            border-left: 5px solid #ffd600;
        }
        .status-success {
            background-color: #e8f5e9;
            border-left: 5px solid #4CAF50;
        }
        .status-error {
            background-color: #ffebee;
            border-left: 5px solid #f44336;
        }
        .logs {
            background-color: #f8f9fa;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }
        .error-log {
            color: #f44336;
        }
        .flash-messages {
            margin-bottom: 15px;
        }
        .flash-message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 3px;
            background-color: #ffebee;
            color: #f44336;
            border-left: 5px solid #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ContentFlow</h1>
        </header>
        
        {% if get_flashed_messages() %}
        <div class="flash-messages">
            {% for message in get_flashed_messages() %}
                <div class="flash-message">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
